name: Extract Website ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          unzip -o "rahul-digital-lab (1).zip" -d .
          rm -f "rahul-digital-lab (1).zip"

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract RAHUL DIGITAL LAB website"
          git push
